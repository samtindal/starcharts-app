name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  REGION: us-central1
  REPO: starcharts # Artifact Registry repository_id from terraform

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy-mcp:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/mcp:${{ github.sha }}"
          docker build -f apps/mcp/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy starcharts-mcp \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe starcharts-mcp --region ${{ env.REGION }} --project ${{ secrets.GCP_PROJECT_ID }} --format 'value(status.url)')
          curl -sf "$URL/healthz" | grep -q '"ok":true'
          curl -sf "$URL/api/chart" | grep -q '"positions"'
          echo "Smoke test passed: $URL"

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/web:${{ github.sha }}"
          docker build -f apps/web/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy starcharts-web \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe starcharts-web --region ${{ env.REGION }} --project ${{ secrets.GCP_PROJECT_ID }} --format 'value(status.url)')
          curl -sf "$URL/" | grep -qi "starcharts"
          curl -sf "$URL/aspects/mars-trine-pluto" | grep -q "trine"
          curl -sf "$URL/sitemap.xml" | grep -q "<url>"
          echo "Smoke test passed: $URL"
