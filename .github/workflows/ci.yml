name: CI

# Tests only. Deploys are handled by Firebase App Hosting's GitHub integration,
# which builds and rolls out the web app automatically on push to the live branch
# (see docs/firebase-migration-runbook.md). The old Cloud Run build/push/deploy
# jobs were retired with the move to App Hosting.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (hardening spec B5, CICD-2 / SC-4).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
