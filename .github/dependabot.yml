# Dependency scanning (hardening spec B5, CICD-1 / SC-3).
# Weekly npm updates across the monorepo root (workspaces are covered from here)
# and the GitHub Actions used in CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
