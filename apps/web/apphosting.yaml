# Firebase App Hosting config for the Starcharts web app.
# The backend's root directory is set to apps/web when the backend is created
# in the Firebase console (this is a monorepo). App Hosting auto-detects Next.js,
# runs `next build`, and serves SSR/ISR on managed Cloud Run behind its CDN.

runConfig:
  minInstances: 0 # scale to zero: ~$0 when idle, matches the old Cloud Run posture
  maxInstances: 100
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Origin-fence secret (hardening spec B6, NET-1). The Secret Manager secret
  # is provisioned, the App Hosting runtime service account has access, and
  # the matching Cloudflare Transform Rule (Rules > Transform Rules, sets
  # x-origin-fence on every proxied request) is live, so this can be enabled
  # for real: apps/web/middleware.ts now rejects any request that reaches the
  # origin without the matching header, closing the direct-to-origin bypass.
  - variable: ORIGIN_FENCE_SECRET
    secret: origin-fence-secret
    availability: [RUNTIME]

  # GA4 measurement ID, not a secret (it's a public client-side config value,
  # same tier as the Firebase Web API key). Created automatically when
  # Analytics was enabled during Firebase project setup (2026-07-14).
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: 'G-323CFTW8SH'
    availability: [BUILD, RUNTIME]

  # AdSense application submitted 2026-07-14, publisher ID assigned; account
  # not yet approved and no ad units created (registry.ts's networkUnit.adsense
  # is still empty per slot), so no ad content actually renders yet. The base
  # adsbygoogle.js script loads sitewide once a visitor's consent resolves
  # (Google explicitly supports and expects consent-gated loading for
  # GDPR-compliant publishers), matching Google's own guidance to have the
  # code live on every page during the application/review process.
  - variable: NEXT_PUBLIC_ADSENSE_CLIENT
    value: 'ca-pub-1345221775096327'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_AD_PROVIDER
    value: 'adsense'
    availability: [BUILD, RUNTIME]

  # Funding Choices (Google's certified CMP) published 2026-07-14: 3-choice
  # message (Consent / Do not consent / Manage options), covering EEA/UK/
  # Switzerland, matching current EDPB equal-prominence guidance. Takes over
  # EEA/UK consent handling from the fallback ConsentBanner.
  - variable: NEXT_PUBLIC_GOOGLE_CMP_ENABLED
    value: 'true'
    availability: [BUILD, RUNTIME]
